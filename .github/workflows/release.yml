name: Release Slyber Inspector

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Verify binaries and SHA256SUMS
        run: |
          cd bin
          sha256sum -c SHA256SUMS
          chmod +x slyber_test-linux-amd64
          ./slyber_test-linux-amd64 --version

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "Slyber Inspector ${{ steps.vars.outputs.TAG }}"
          generate_release_notes: true
          files: |
            bin/slyber_test-linux-amd64
            bin/slyber_test-linux-arm64
            bin/slyber_test-darwin-arm64
            bin/slyber_test-darwin-amd64
            bin/SHA256SUMS
            install.sh
            docker-compose.yml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.TAG }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/slyber-inspector:${{ steps.vars.outputs.TAG }}
            ghcr.io/${{ github.repository_owner }}/slyber-inspector:latest